question: Which program is right for my rider?
answer: Riders who love longer rides, building endurance, and cross-country racing join Flyers XC. Riders who love technical descents, jumps, and bike parks join Flyers Enduro/Gravity (age 10 and up). Our youngest riders start with Jr. Flyers in the summer (June–August), where they learn braking, shifting, and trail confidence through games and short rides. Each program page lists the grades it serves, and none of the programs require racing.
