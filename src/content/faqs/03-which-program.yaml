question: Which program is right for my rider?
answer: Riders who love cross-country riding join Flyers XC, in either DEVO (skills and fun) or COMP (high-level racing). Riders who love technical descents, jumps, and bike parks join Flyers Enduro/Gravity (age 10 and up). Our youngest riders start with Jr. Flyers in the summer (June–August), where they learn braking, shifting, and trail confidence through games and short rides. Each program page lists the grades it serves, and none of the programs require racing.
