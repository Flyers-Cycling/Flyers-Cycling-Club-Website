question: Can parents volunteer?
answer: Yes, please. Parents are the heart of Flyers. You can sweep a ride, help on Enduro/Gravity skills days, run the race-day tent, join a trail workday, help with sponsors or team kits, post club updates, or take photos and video. You don't need to be a fast rider, and we'll show you what to do. See the Volunteer page, or email info@lakemountainflyers.com to get started.
