question: Why is registration so affordable?
answer: Everyone who coaches and runs Flyers is a volunteer, so nobody draws a salary. Registration is $35 for Jr. Flyers, $50 for Flyers XC, and $150 for Flyers Enduro/Gravity. It covers a club t-shirt and rider insurance. Sponsors and donors to Lake Mountain Bicycle Club, Inc. (a 501(c)(3) non-profit) pay for the rest, so cost doesn't keep kids off the trail.
