# Bio from Randall's answers (Nov 22, 2026).
bio: Coaches Flyers XC and is a licensed NICA coach for Lehi MTB. He has ridden mountain bikes since he was 10.
fullBio: |
  Randall has ridden mountain bikes since he was 10 and has coached for six years. He is a licensed
  NICA coach for the Lehi MTB high school team. He still races endurance events too, and took third
  in the 40–49 category at the 2026 Sea Otter Classic after earlier elite podiums at Intermountain
  Cup races.

  At Flyers XC, he wants every rider to have fun and love being on a bike. The skills and personal
  goals come along with that.

  Randall lives in Lehi with his wife and their four kids, who all ride. His favorite trail is
  Hollow Point.
