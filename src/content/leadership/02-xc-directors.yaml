bio: Coaches Flyers XC. He has ridden mountain bikes since he was 10 and has coached for six years.
fullBio: |
  Randall has ridden mountain bikes since he was 10 and has coached for six years. He still races
  endurance events himself, with a third-place finish at the Sea Otter Classic and earlier elite
  podiums at Intermountain Cup races.

  With Flyers XC, he coaches from the winter base rides through the summer mountain rides.
